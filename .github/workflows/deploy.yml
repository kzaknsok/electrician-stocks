name: Update Financials and Deploy to GitHub Pages

on:
  # 1. 定期自動実行（毎日 JST 午前0時 = UTC 15時）
  schedule:
    - cron: '0 15 * * *'
  
  # 2. main ブランチへの Push 時に自動実行
  push:
    branches:
      - main

  # 3. GitHub の Actions タブから手動で実行できるようにする
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限設定
permissions:
  contents: write
  pages: write
  id-token: write

# 同時実行の制御（進行中のデプロイがある場合はキャンセル）
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # --- Step 1: リポジトリのチェックアウト ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Step 2: Python 環境のセットアップ ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- Step 3: 依存ライブラリのインストール ---
      # データ取得用の Python スクリプト等で使用するライブラリ（yfinance等）をインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Step 4: 財務データ取得スクリプトの実行 ---
      # ※ データ更新用スクリプト（例: scripts/update_data.py）を実行して financials.json を更新
      - name: Run data fetch script
        run: |
          if [ -f scripts/update_data.py ]; then
            python scripts/update_data.py
          fi

      # --- Step 5: 更新された financials.json を Git コミット＆Push ---
      - name: Commit & Push updated financials.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/financials.json || git add data/financials.json || true
          if git diff --staged --quiet; then
            echo "No changes in financial data."
          else
            git commit -m "chore: auto-update financial data [skip ci]"
            git push
          fi

      # --- Step 6: GitHub Pages のセットアップ ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --- Step 7: 静的ファイル（Webサイト構成物）のアップロード ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # リポジトリ全体を公開ルートとしてデプロイ

      # --- Step 8: GitHub Pages へのデプロイ実行 ---
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4