name: Update Financials and Deploy to GitHub Pages

on:
  # 1. 毎日 JST 午前0時（＝UTC 15時）に定期自動実行
  schedule:
    - cron: '0 15 * * *'
  
  # 2. main ブランチへの Push 時に自動実行
  push:
    branches:
      - main

  # 3. GitHub の Actions タブから手動実行できるようにする
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # --- Step 1: リポジトリのチェックアウト ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Step 2: Node.js 環境のセットアップ ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # package-lock.json があればキャッシュして高速化

      # --- Step 3: 依存パッケージのインストール ---
      - name: Install dependencies
        run: npm ci || npm install

      # --- Step 4: データ更新スクリプトの実行 ---
      # npm run update や node スクリプトなどプロジェクトの更新コマンドに合わせて実行します
      - name: Run data update script
        run: |
          if npm run | grep -q "update"; then
            npm run update
          elif [ -f scripts/update.js ]; then
            node scripts/update.js
          fi

      # --- Step 5: 更新データのコミット & Push ---
      - name: Commit & Push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if git diff --staged --quiet; then
            echo "No changes in financial data."
          else
            git commit -m "chore: auto-update financial data [skip ci]"
            git push
          fi

      # --- Step 6: GitHub Pages のセットアップ ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --- Step 7: 静的ファイル（ビルド成果物）のアップロード ---
      # Vite/React等のビルドを行う場合は npm run build 後に dist を指定します
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # フレームワーク等で dist や build フォルダに出力される場合はそのパス（例: './dist'）を指定

      # --- Step 8: デプロイ実行 ---
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4